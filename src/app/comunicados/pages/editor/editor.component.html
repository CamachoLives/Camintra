<div class="mx-auto max-w-3xl space-y-6">
  <a
    routerLink="/comunicados"
    class="inline-flex items-center gap-1 text-sm text-gray-500 hover:text-gray-900"
  >
    &larr; Volver a comunicados
  </a>

  <h1 class="text-2xl font-bold text-gray-900">
    {{ id() ? 'Editar comunicado' : 'Nuevo comunicado' }}
  </h1>

  <div
    *ngIf="error()"
    class="rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-700"
  >
    {{ error() }}
  </div>

  <form
    class="space-y-5 rounded-xl border border-gray-200 bg-white p-6 shadow-sm"
    (ngSubmit)="guardar()"
  >
    <div>
      <label class="mb-1 block text-sm font-medium text-gray-700">Título</label>
      <input
        [(ngModel)]="modelo.titulo"
        name="titulo"
        type="text"
        maxlength="200"
        class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-gray-900 focus:outline-none"
      />
    </div>

    <div>
      <label class="mb-1 block text-sm font-medium text-gray-700">
        Resumen <span class="text-gray-400">(se muestra en el listado)</span>
      </label>
      <input
        [(ngModel)]="modelo.resumen"
        name="resumen"
        type="text"
        maxlength="400"
        class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-gray-900 focus:outline-none"
      />
    </div>

    <div>
      <label class="mb-1 block text-sm font-medium text-gray-700">
        Contenido
      </label>
      <textarea
        [(ngModel)]="modelo.contenido"
        name="contenido"
        rows="10"
        class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-gray-900 focus:outline-none"
      ></textarea>
    </div>

    <div class="grid gap-4 md:grid-cols-3">
      <div>
        <label class="mb-1 block text-sm font-medium text-gray-700">
          Categoría
        </label>
        <select
          [(ngModel)]="modelo.categoria_id"
          name="categoria_id"
          class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-gray-900 focus:outline-none"
        >
          <option [ngValue]="null">Sin categoría</option>
          <option *ngFor="let cat of categorias()" [ngValue]="cat.id">
            {{ cat.nombre }}
          </option>
        </select>
      </div>

      <div>
        <label class="mb-1 block text-sm font-medium text-gray-700">
          Prioridad
        </label>
        <select
          [(ngModel)]="modelo.prioridad"
          name="prioridad"
          class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-gray-900 focus:outline-none"
        >
          <option value="baja">Baja</option>
          <option value="normal">Normal</option>
          <option value="alta">Alta</option>
          <option value="urgente">Urgente</option>
        </select>
      </div>

      <div>
        <label class="mb-1 block text-sm font-medium text-gray-700">
          Vigente hasta
        </label>
        <input
          [(ngModel)]="modelo.expira_en"
          name="expira_en"
          type="date"
          class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-gray-900 focus:outline-none"
        />
      </div>
    </div>

    <label class="flex items-center gap-2 text-sm text-gray-700">
      <input
        type="checkbox"
        [(ngModel)]="modelo.fijado"
        name="fijado"
        class="rounded border-gray-300"
      />
      Fijar al inicio del listado
    </label>

    <div class="flex flex-wrap gap-3 border-t border-gray-200 pt-5">
      <button
        type="submit"
        [disabled]="guardando()"
        class="rounded-lg border border-gray-300 px-4 py-2 text-sm font-semibold text-gray-700 hover:bg-gray-50 disabled:opacity-50"
      >
        Guardar borrador
      </button>

      <button
        type="button"
        (click)="guardar(true)"
        [disabled]="guardando()"
        class="rounded-lg bg-gray-900 px-4 py-2 text-sm font-semibold text-white hover:bg-gray-700 disabled:opacity-50"
      >
        {{ guardando() ? 'Guardando...' : 'Publicar' }}
      </button>
    </div>
  </form>
</div>
