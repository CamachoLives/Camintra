<div class="mx-auto max-w-3xl space-y-6">
  <a
    routerLink="/wiki"
    class="inline-flex items-center gap-1 text-sm text-gray-500 hover:text-gray-900"
  >
    &larr; Volver a la wiki
  </a>

  <div *ngIf="cargando()" class="py-12 text-center text-gray-500">
    Cargando documento...
  </div>

  <div
    *ngIf="error()"
    class="rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-700"
  >
    {{ error() }}
  </div>

  <article
    *ngIf="documento() as d"
    class="rounded-xl border border-gray-200 bg-white p-8 shadow-sm"
  >
    <div class="mb-4 flex flex-wrap items-center gap-2">
      <span
        class="rounded-full bg-gray-100 px-2.5 py-0.5 text-xs font-semibold text-gray-700"
      >
        {{ d.categoria }}
      </span>

      <span
        *ngIf="d.estado === 'borrador'"
        class="rounded-full bg-yellow-100 px-2.5 py-0.5 text-xs font-semibold text-yellow-800"
      >
        Borrador
      </span>

      <span class="ml-auto text-xs text-gray-400">
        versión {{ d.version }} &middot; {{ d.vistas }} vista(s)
      </span>
    </div>

    <h1 class="mb-2 text-3xl font-bold leading-tight text-gray-900">
      {{ d.titulo }}
    </h1>

    <p class="mb-6 text-sm text-gray-500">
      {{ d.autor }}
      <span *ngIf="d.departamento"> &middot; {{ d.departamento }}</span>
      &middot; actualizado el {{ d.updated_at | date: 'dd MMMM yyyy' }}
    </p>

    <p *ngIf="d.resumen" class="mb-6 text-lg font-medium text-gray-700">
      {{ d.resumen }}
    </p>

    <div class="whitespace-pre-line leading-relaxed text-gray-800">
      {{ d.contenido }}
    </div>

    <div *ngIf="d.etiquetas?.length" class="mt-8 flex flex-wrap gap-2">
      <span
        *ngFor="let tag of d.etiquetas"
        class="rounded bg-blue-50 px-2 py-0.5 text-xs text-blue-700"
      >
        #{{ tag }}
      </span>
    </div>

    <div
      *ngIf="puedeEditar()"
      class="mt-8 flex gap-3 border-t border-gray-200 pt-6"
    >
      <a
        [routerLink]="['/wiki', d.slug, 'editar']"
        class="rounded-lg bg-gray-900 px-4 py-2 text-sm font-semibold text-white hover:bg-gray-700"
      >
        Editar
      </a>

      <button
        (click)="eliminar()"
        class="rounded-lg border border-red-300 px-4 py-2 text-sm font-semibold text-red-700 hover:bg-red-50"
      >
        Eliminar
      </button>
    </div>
  </article>
</div>
