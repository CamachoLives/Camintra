<div class="mx-auto max-w-3xl space-y-6">
  <a
    routerLink="/wiki"
    class="inline-flex items-center gap-1 text-sm text-gray-500 hover:text-gray-900"
  >
    &larr; Volver a la wiki
  </a>

  <h1 class="text-2xl font-bold text-gray-900">
    {{ id() ? 'Editar documento' : 'Nuevo documento' }}
  </h1>

  <div
    *ngIf="error()"
    class="rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-700"
  >
    {{ error() }}
  </div>

  <form
    class="space-y-5 rounded-xl border border-gray-200 bg-white p-6 shadow-sm"
    (ngSubmit)="guardar()"
  >
    <div>
      <label class="mb-1 block text-sm font-medium text-gray-700">Título</label>
      <input
        [(ngModel)]="modelo.titulo"
        name="titulo"
        type="text"
        maxlength="200"
        class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-gray-900 focus:outline-none"
      />
      <p *ngIf="!id()" class="mt-1 text-xs text-gray-500">
        La dirección del documento se genera a partir del título.
      </p>
    </div>

    <div>
      <label class="mb-1 block text-sm font-medium text-gray-700">Resumen</label>
      <input
        [(ngModel)]="modelo.resumen"
        name="resumen"
        type="text"
        maxlength="400"
        class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-gray-900 focus:outline-none"
      />
    </div>

    <div>
      <label class="mb-1 block text-sm font-medium text-gray-700">
        Contenido
      </label>
      <textarea
        [(ngModel)]="modelo.contenido"
        name="contenido"
        rows="16"
        class="w-full rounded-lg border border-gray-300 px-3 py-2 font-mono text-sm focus:border-gray-900 focus:outline-none"
      ></textarea>
    </div>

    <div class="grid gap-4 md:grid-cols-2">
      <div>
        <label class="mb-1 block text-sm font-medium text-gray-700">
          Categoría
        </label>
        <input
          [(ngModel)]="modelo.categoria"
          name="categoria"
          type="text"
          class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-gray-900 focus:outline-none"
        />
      </div>

      <div>
        <label class="mb-1 block text-sm font-medium text-gray-700">
          Departamento
        </label>
        <select
          [(ngModel)]="modelo.departamento_id"
          name="departamento_id"
          class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-gray-900 focus:outline-none"
        >
          <option [ngValue]="null">Toda la empresa</option>
          <option *ngFor="let dep of departamentos()" [ngValue]="dep.id">
            {{ dep.nombre }}
          </option>
        </select>
      </div>
    </div>

    <div>
      <label class="mb-1 block text-sm font-medium text-gray-700">
        Etiquetas <span class="text-gray-400">(separadas por coma)</span>
      </label>
      <input
        [(ngModel)]="etiquetasTexto"
        name="etiquetas"
        type="text"
        placeholder="vacaciones, politica, rrhh"
        class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-gray-900 focus:outline-none"
      />
    </div>

    <div class="flex flex-wrap gap-3 border-t border-gray-200 pt-5">
      <button
        type="submit"
        [disabled]="guardando()"
        class="rounded-lg border border-gray-300 px-4 py-2 text-sm font-semibold text-gray-700 hover:bg-gray-50 disabled:opacity-50"
      >
        Guardar borrador
      </button>

      <button
        type="button"
        (click)="guardar(true)"
        [disabled]="guardando()"
        class="rounded-lg bg-gray-900 px-4 py-2 text-sm font-semibold text-white hover:bg-gray-700 disabled:opacity-50"
      >
        {{ guardando() ? 'Guardando...' : 'Publicar' }}
      </button>
    </div>
  </form>
</div>
