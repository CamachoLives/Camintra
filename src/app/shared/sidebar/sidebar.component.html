<button
  *ngIf="!isSidebarOpen"
  (click)="toggleSidebar()"
  class="fixed left-4 top-4 z-50 rounded-md bg-gray-700 p-2 text-white xl:hidden"
  aria-label="Abrir menú"
>
  ☰
</button>

<aside
  [ngClass]="{
    '-translate-x-80': !isSidebarOpen,
    'translate-x-0': isSidebarOpen
  }"
  class="fixed inset-y-0 left-0 z-40 my-4 ml-4 flex h-[calc(100vh-32px)] w-72 flex-col rounded-xl bg-black transition-transform duration-300 xl:translate-x-0"
>
  <!-- Marca -->
  <div class="relative border-b border-white/20">
    <a class="flex items-center gap-4 px-8 py-6" routerLink="/Inicio">
      <h6 class="font-sans text-base font-semibold text-white">CAMINTRA</h6>
      <span class="text-xs uppercase tracking-widest text-white/50">
        Intranet
      </span>
    </a>

    <button
      (click)="toggleSidebar()"
      class="absolute right-0 top-0 grid h-8 w-8 rounded-lg text-white hover:bg-white/10 xl:hidden"
      type="button"
      aria-label="Cerrar menú"
    >
      <span
        class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 transform"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="2.5"
          stroke="currentColor"
          class="h-5 w-5 text-white"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </span>
    </button>
  </div>

  <!-- Menú -->
  <nav class="m-4 flex-1 overflow-y-auto">
    <ul class="flex flex-col gap-1">
      <li *ngFor="let item of itemsVisibles">
        <a [routerLink]="item.ruta" (click)="isSidebarOpen = false">
          <button
            routerLinkActive="bg-gradient-to-tr from-gray-800 to-gray-500 shadow-md shadow-gray-700/20"
            class="flex w-full items-center gap-4 rounded-lg px-4 py-3 text-white transition-all hover:bg-white/10 active:bg-white/30"
            type="button"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-6 shrink-0"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                [attr.d]="item.icono"
              />
            </svg>

            <span class="font-sans text-base font-medium capitalize">
              {{ item.etiqueta }}
            </span>

            <span
              *ngIf="item.ruta === '/comunicados' && noLeidos() > 0"
              class="ml-auto rounded-full bg-blue-600 px-2 py-0.5 text-xs font-bold text-white"
            >
              {{ noLeidos() }}
            </span>
          </button>
        </a>
      </li>
    </ul>
  </nav>

  <!-- Pie: usuario y salida -->
  <div class="border-t border-white/20 p-4">
    <p class="mb-2 px-2 text-xs font-black uppercase text-white/60">
      {{ rol() }}
    </p>

    <a routerLink="/user" (click)="isSidebarOpen = false">
      <button
        routerLinkActive="bg-gradient-to-tr from-gray-800 to-gray-500"
        class="flex w-full items-center gap-3 rounded-lg px-4 py-3 text-white transition-all hover:bg-white/10"
        type="button"
      >
        <span
          class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-white/20 text-xs font-bold"
        >
          {{ nombre() ? iniciales(nombre()) : '?' }}
        </span>

        <span class="truncate font-sans text-sm font-medium">
          {{ nombre() || 'Mi perfil' }}
        </span>
      </button>
    </a>

    <button
      (click)="cerrarSesion()"
      class="mt-1 flex w-full items-center gap-3 rounded-lg px-4 py-3 text-white/70 transition-all hover:bg-white/10 hover:text-white"
      type="button"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="currentColor"
        class="h-5 w-5 shrink-0"
      >
        <path
          fill-rule="evenodd"
          d="M7.5 3.75A1.5 1.5 0 006 5.25v13.5a1.5 1.5 0 001.5 1.5h6a1.5 1.5 0 001.5-1.5V15a.75.75 0 011.5 0v3.75a3 3 0 01-3 3h-6a3 3 0 01-3-3V5.25a3 3 0 013-3h6a3 3 0 013 3V9A.75.75 0 0115 9V5.25a1.5 1.5 0 00-1.5-1.5h-6zm10.72 4.72a.75.75 0 011.06 0l3 3a.75.75 0 010 1.06l-3 3a.75.75 0 11-1.06-1.06l1.72-1.72H9a.75.75 0 010-1.5h10.94l-1.72-1.72a.75.75 0 010-1.06z"
          clip-rule="evenodd"
        />
      </svg>

      <span class="font-sans text-sm font-medium">Cerrar sesión</span>
    </button>
  </div>
</aside>
