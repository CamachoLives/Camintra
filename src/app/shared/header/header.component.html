<div
  class="flex flex-col-reverse justify-between gap-6 md:flex-row md:items-center"
>
  <div class="capitalize">
    <h6 class="font-sans text-base font-semibold text-gray-900">
      {{ currentRoute }}
    </h6>
  </div>

  <div class="flex items-center gap-2">
    <!-- Campanita -->
    <div class="relative">
      <button
        (click)="togglePanel()"
        class="relative grid h-10 w-10 place-items-center rounded-lg text-gray-500 transition-all hover:bg-gray-500/10"
        type="button"
        aria-label="Notificaciones"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="size-6"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0"
          />
        </svg>

        <span
          *ngIf="noLeidas() > 0"
          class="absolute right-1 top-1 flex h-4 min-w-4 items-center justify-center rounded-full bg-red-600 px-1 text-[10px] font-bold text-white"
        >
          {{ noLeidas() }}
        </span>
      </button>

      <!-- Panel -->
      <div
        *ngIf="panelAbierto()"
        class="absolute right-0 z-50 mt-2 w-80 rounded-xl border border-gray-200 bg-white shadow-lg"
      >
        <div
          class="flex items-center justify-between border-b border-gray-100 px-4 py-3"
        >
          <span class="text-sm font-semibold text-gray-900">
            Notificaciones
          </span>

          <button
            *ngIf="noLeidas() > 0"
            (click)="marcarTodas()"
            class="text-xs text-gray-500 underline hover:text-gray-900"
          >
            Marcar todas
          </button>
        </div>

        <div class="max-h-80 overflow-y-auto">
          <button
            *ngFor="let n of items()"
            (click)="abrir(n)"
            class="flex w-full gap-3 border-b border-gray-50 px-4 py-3 text-left transition hover:bg-gray-50"
          >
            <span
              class="mt-1.5 h-2 w-2 shrink-0 rounded-full"
              [class.bg-blue-600]="!n.leida"
              [class.bg-transparent]="n.leida"
            ></span>

            <span class="min-w-0 flex-1">
              <span class="block truncate text-sm font-medium text-gray-900">
                {{ n.titulo }}
              </span>
              <span class="block truncate text-xs text-gray-600">
                {{ n.mensaje }}
              </span>
              <span class="mt-0.5 block text-[11px] text-gray-400">
                {{ n.created_at | date: 'dd MMM, HH:mm' }}
              </span>
            </span>
          </button>

          <p
            *ngIf="items().length === 0"
            class="px-4 py-8 text-center text-sm text-gray-500"
          >
            No tienes notificaciones.
          </p>
        </div>
      </div>
    </div>

    <!-- Configuración -->
    <a
      routerLink="/configuracion"
      class="grid h-10 w-10 place-items-center rounded-lg text-gray-500 transition-all hover:bg-gray-500/10"
      aria-label="Configuración"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="h-6 w-6"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M10.343 3.94c.09-.542.56-.94 1.11-.94h1.093c.55 0 1.02.398 1.11.94l.149.894c.07.424.384.764.78.93.398.164.855.142 1.205-.108l.737-.527a1.125 1.125 0 0 1 1.45.12l.773.774c.39.389.44 1.002.12 1.45l-.527.737c-.25.35-.272.806-.107 1.204.165.397.505.71.93.78l.893.15c.543.09.94.559.94 1.109v1.094c0 .55-.397 1.02-.94 1.11l-.894.149c-.424.07-.764.383-.929.78-.165.398-.143.854.107 1.204l.527.738c.32.447.269 1.06-.12 1.45l-.774.773a1.125 1.125 0 0 1-1.449.12l-.738-.527c-.35-.25-.806-.272-1.203-.107-.398.165-.71.505-.781.929l-.149.894c-.09.542-.56.94-1.11.94h-1.094c-.55 0-1.019-.398-1.11-.94l-.148-.894c-.071-.424-.384-.764-.781-.93-.398-.164-.854-.142-1.204.108l-.738.527c-.447.32-1.06.269-1.45-.12l-.773-.774a1.125 1.125 0 0 1-.12-1.45l.527-.737c.25-.35.272-.806.108-1.204-.165-.397-.506-.71-.93-.78l-.894-.15c-.542-.09-.94-.56-.94-1.109v-1.094c0-.55.398-1.02.94-1.11l.894-.149c.424-.07.765-.383.93-.78.165-.398.143-.854-.108-1.204l-.526-.738a1.125 1.125 0 0 1 .12-1.45l.773-.773a1.125 1.125 0 0 1 1.45-.12l.737.527c.35.25.807.272 1.204.107.397-.165.71-.505.78-.929l.15-.894Z"
        />
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
        />
      </svg>
    </a>
  </div>
</div>
